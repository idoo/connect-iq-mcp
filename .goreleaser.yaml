# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Local dry run:
#   goreleaser release --snapshot --clean --skip=publish,sign
version: 2

project_name: garmin-mcp

before:
  hooks:
    - go mod download

builds:
  - id: garmin-mcp
    main: ./cmd/garmin-mcp
    binary: garmin-mcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # No build date: two builds of the same tag must be byte-identical so the
    # provenance attestation can be reproduced.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Fat darwin binary for the .mcpb bundle only (mcpb platform overrides are
# per-OS, not per-arch). Archives below take only the per-arch `garmin-mcp` builds.
universal_binaries:
  - id: garmin-mcp-universal
    ids: [garmin-mcp]
    name_template: garmin-mcp
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: garmin-mcp
    ids: [garmin-mcp]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

# Keyless cosign (GitHub OIDC) over checksums.txt; the bundle covers every
# archive through its sha256. Verify:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/idoo/garmin-mcp/.github/workflows/release.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore\\(deps\\)"
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^.*?(\([^)]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]+\))?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix(\([^)]+\))?:.+$'
      order: 2
    - title: Security
      regexp: '^.*?sec(urity)?(\([^)]+\))?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([^)]+\))?:.+$'
      order: 4
    - title: Other
      order: 999

release:
  github:
    owner: idoo
    name: garmin-mcp
  prerelease: auto
  # Immutable releases: goreleaser only creates a draft; release.yml adds the
  # .mcpb, tools.json and attestations, then publishes it as the last step.
  draft: true
  replace_existing_draft: false
  mode: keep-existing
  footer: |
    **Install:** `brew install idoo/tap/garmin-mcp`, `curl -fsSL https://raw.githubusercontent.com/idoo/garmin-mcp/main/install.sh | sh`,
    `go install github.com/idoo/garmin-mcp/cmd/garmin-mcp@{{ .Tag }}`,
    or `garmin-mcp-{{ .Version }}.mcpb` for Claude Desktop.

    **Verify:** `gh attestation verify garmin-mcp_{{ .Version }}_<os>_<arch>.tar.gz --repo idoo/garmin-mcp`, or
    `cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp '^https://github.com/idoo/garmin-mcp/.github/workflows/release.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`.
    The .mcpb is listed in `garmin-mcp-{{ .Version }}.mcpb.sha256`.
