version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - govet
    - misspell
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    depguard:
      rules:
        mcp-sdk:
          files:
            - "$all"
            - "!**/internal/mcpserver/**"
            - "!**/internal/tools/docsgen/**"
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: only internal/mcpserver and internal/tools/docsgen talk to the MCP SDK
        jsonschema:
          files:
            - "$all"
            - "!**/internal/mcpserver/**"
            - "!**/internal/tools/docsgen/**"
            - "!**/internal/tool/*.go"
          deny:
            - pkg: github.com/google/jsonschema-go
              desc: schemas are inferred by internal/tool; tools declare plain Go structs
        domain-tools:
          files:
            - "**/internal/tools/**"
            - "!**/internal/tools/docsgen/**"
          deny:
            - pkg: github.com/idoo/garmin-mcp/internal/app
              desc: tool packages use tool.Env, never the app wiring
            - pkg: github.com/idoo/garmin-mcp/internal/mcpserver
              desc: tool packages use tool.Env, never the server
        credstore-storage:
          files:
            - "**/internal/credstore/**"
          deny:
            - pkg: github.com/idoo/garmin-mcp/internal/browser
              desc: credstore is storage plus renewal policy; it drives the browser only through credstore.Browser (internal/auth/login implements it)
            - pkg: github.com/idoo/garmin-mcp/internal/auth/login
              desc: internal/auth/login depends on credstore, never the reverse
            - pkg: github.com/idoo/garmin-mcp/internal/app
              desc: credstore is wired by app and cmd, never the reverse
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: stdout is the MCP stdio channel; log to stderr or return results
        - pattern: ^os\.Stdout$
          msg: stdout is the MCP stdio channel
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: ^cmd/
        linters: [forbidigo]
      - path: _test\.go
        linters: [gosec, unparam]
      - path: internal/tools/all/
        linters: [revive]
        text: blank-imports

formatters:
  enable:
    - gofumpt
